<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Model Viewer (dev)</title>
<!--
  ビルドなしの作品では、three の場所を importmap で教える（Vite の作品ではこのブロックを消す）。
  <script type="importmap">{ "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"
  } }</script>
-->
<style>
  :root { --bg: #afafb4; --ink: #1d1d22; --chip: #fffffff0; --on: #5b4a49; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--ink); font: 12px/1.4 system-ui, sans-serif; }
  #stage { position: fixed; inset: 0; display: flex; }
  #stage canvas { display: block; flex: 1 1 auto; min-width: 0; }
  #refside { display: none; flex: 1 1 50%; background: #0002 center / contain no-repeat; }
  #stage.side #refside { display: block; }
  #stage.side ~ #side { display: none; } /* 横並びのときは参照画像を隠さないよう部品パネルを畳む */
  #stage.side ~ #ui { right: 8px; }
  #refover { position: fixed; inset: 0; pointer-events: none; background: center / contain no-repeat; display: none; }
  #refover.over { display: block; }
  #refover.diff { display: block; mix-blend-mode: difference; opacity: 1 !important; }
  #ui { position: fixed; left: 8px; top: 8px; right: 260px; z-index: 2; display: flex; flex-direction: column; gap: 4px; pointer-events: none; }
  .row { display: flex; flex-wrap: wrap; gap: 3px; align-items: center; pointer-events: auto; }
  .row b { font-weight: 600; opacity: .6; margin-right: 2px; min-width: 42px; }
  button { font: inherit; padding: 3px 7px; border: 1px solid #0003; border-radius: 6px; background: var(--chip); color: var(--ink); cursor: pointer; }
  button.on { background: var(--on); color: #fff; }
  input[type=range] { width: 90px; }
  #side { position: fixed; right: 8px; top: 8px; bottom: 30px; width: 244px; z-index: 2; display: flex; flex-direction: column; gap: 4px; }
  #parts { flex: 1; overflow: auto; background: var(--chip); border-radius: 8px; padding: 4px 6px; white-space: nowrap; }
  #parts label { display: block; cursor: pointer; }
  #parts label.hit { background: #ffe08a; }
  #nan { background: var(--chip); border-radius: 8px; padding: 4px 6px; max-height: 30%; overflow: auto; white-space: pre-wrap; }
  #info { position: fixed; left: 8px; bottom: 6px; z-index: 2; white-space: pre; text-shadow: 0 0 3px #fff8; }
  #drop { position: fixed; inset: 0; z-index: 5; display: none; place-items: center; background: #0006; color: #fff; font-size: 20px; }
  body.dragging #drop { display: grid; }
  body.clean #ui, body.clean #side, body.clean #info { display: none; }
</style>
</head>
<body>
<div id="stage"><div id="refside"></div></div>
<div id="refover"></div>
<div id="ui"></div>
<div id="side">
  <div class="row"><button id="nanbtn">NaN チェック</button><button id="allon">全部表示</button><button id="hidebtn">UI を隠す (H)</button></div>
  <div id="nan">クリックで部品の名前を表示</div>
  <div id="parts"></div>
</div>
<div id="info"></div>
<div id="drop">参照画像をここに落とす（今のカメラ位置の参照になります）</div>
<script type="module" src="./viewer.js"></script>
</body>
</html>
